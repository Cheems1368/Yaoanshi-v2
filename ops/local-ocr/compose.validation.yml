services:
  mysql:
    image: mysql@sha256:64756cc92f707eb504496d774353990bcb0f6999ddf598b6ad188f2da66bd000
    container_name: yaoanshi-ocr-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:18306:3306"
    environment:
      MYSQL_DATABASE: yaoanshi_ocr_validation
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Load the existing local database password first}
    volumes:
      - ocr_mysql:/var/lib/mysql
volumes:
  ocr_mysql:
