services:
  mysql:
    container_name: medicine-mysql-prod
    image: mysql:8.0
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medicine}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - mysql_prod_data:/var/lib/mysql/
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    secrets:
      - db_password
    networks:
      - medicine-prod-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_password)"]
      timeout: 20s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /var/run/mysqld

  redis:
    container_name: medicine-redis-prod
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - medicine-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  server:
    container_name: medicine-backend-v2-prod
    build:
      context: ../..
      dockerfile: backend-v2/Dockerfile
    image: medicine-backend-v2:${APP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./.env.prod.local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx1024m -XX:+UseG1GC"}
      MEDICINE_DB_URL: ${MEDICINE_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-medicine}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      MEDICINE_DB_USERNAME: ${MEDICINE_DB_USERNAME:-root}
      MEDICINE_DB_PASSWORD: ${MEDICINE_DB_PASSWORD:-replace-me}
      MEDICINE_LEGACY_DB_URL: ${MEDICINE_LEGACY_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-medicine}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      MEDICINE_LEGACY_DB_USERNAME: ${MEDICINE_LEGACY_DB_USERNAME:-root}
      MEDICINE_LEGACY_DB_PASSWORD: ${MEDICINE_LEGACY_DB_PASSWORD:-replace-me}
      MEDICINE_REDIS_HOST: redis
      MEDICINE_REDIS_PORT: 6379
      MEDICINE_JWT_SECRET: ${MEDICINE_JWT_SECRET:-replace-with-secure-secret}
      MEDICINE_ADMIN_WS_ALLOWED_ORIGINS: ${MEDICINE_ADMIN_WS_ALLOWED_ORIGINS:-https://admin.medicine.local}
      MEDICINE_STORAGE_ENDPOINT: ${MEDICINE_STORAGE_ENDPOINT:-http://minio:9000}
      MEDICINE_STORAGE_BUCKET: ${MEDICINE_STORAGE_BUCKET:-yaoshian-mvp}
      MEDICINE_STORAGE_ACCESS_KEY: ${MEDICINE_STORAGE_ACCESS_KEY:-replace-access-key}
      MEDICINE_STORAGE_SECRET_KEY: ${MEDICINE_STORAGE_SECRET_KEY:-replace-secret-key}
    secrets:
      - db_password
      - redis_password
    networks:
      - medicine-prod-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
      - /app/tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.medicine-server.rule=Host(`api.medicine.local`)"
      - "traefik.http.services.medicine-server.loadbalancer.server.port=8080"

  admin:
    container_name: medicine-admin-prod
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../frontend/pharmacist/dist:/usr/share/nginx/html:ro
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - medicine-prod-network
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    container_name: medicine-prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - medicine-prod-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

  grafana:
    container_name: medicine-grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - medicine-prod-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false

networks:
  medicine-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt.example
  redis_password:
    file: ./secrets/redis_password.txt.example
