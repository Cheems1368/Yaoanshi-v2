services:
  mysql:
    container_name: medicine-mysql
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medicine}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - mysql_data:/var/lib/mysql/
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    secrets:
      - db_password
    networks:
      - medicine-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_password)"]
      timeout: 20s
      retries: 10
      start_period: 30s

  redis:
    container_name: medicine-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - medicine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
      start_period: 30s

  server:
    container_name: medicine-backend-v2-security
    build:
      context: ../..
      dockerfile: backend-v2/Dockerfile
    image: medicine-backend-v2:security
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:-"-Xms512m -Xmx1024m -XX:+UseG1GC"}
      MEDICINE_DB_URL: ${MEDICINE_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-medicine}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      MEDICINE_DB_USERNAME: ${MEDICINE_DB_USERNAME:-root}
      MEDICINE_DB_PASSWORD: ${MEDICINE_DB_PASSWORD:-replace-me}
      MEDICINE_LEGACY_DB_URL: ${MEDICINE_LEGACY_DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-medicine}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      MEDICINE_LEGACY_DB_USERNAME: ${MEDICINE_LEGACY_DB_USERNAME:-root}
      MEDICINE_LEGACY_DB_PASSWORD: ${MEDICINE_LEGACY_DB_PASSWORD:-replace-me}
      MEDICINE_REDIS_HOST: redis
      MEDICINE_REDIS_PORT: 6379
      MEDICINE_JWT_SECRET: ${MEDICINE_JWT_SECRET:-replace-with-secure-secret}
      MEDICINE_ADMIN_WS_ALLOWED_ORIGINS: ${MEDICINE_ADMIN_WS_ALLOWED_ORIGINS:-https://admin.medicine.local}
      MEDICINE_STORAGE_ENDPOINT: ${MEDICINE_STORAGE_ENDPOINT:-http://minio:9000}
      MEDICINE_STORAGE_BUCKET: ${MEDICINE_STORAGE_BUCKET:-yaoshian-mvp}
      MEDICINE_STORAGE_ACCESS_KEY: ${MEDICINE_STORAGE_ACCESS_KEY:-replace-access-key}
      MEDICINE_STORAGE_SECRET_KEY: ${MEDICINE_STORAGE_SECRET_KEY:-replace-secret-key}
    secrets:
      - db_password
      - redis_password
    networks:
      - medicine-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
      - /app/tmp

  admin:
    container_name: medicine-admin
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../frontend/pharmacist/dist:/usr/share/nginx/html:ro
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - medicine-network
    depends_on:
      - server

networks:
  medicine-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt.example
  redis_password:
    file: ./secrets/redis_password.txt.example
