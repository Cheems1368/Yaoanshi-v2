services:
  mysql:
    container_name: medicine-mysql-dev
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: medicine
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - mysql_dev_data:/var/lib/mysql/
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - medicine-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      timeout: 20s
      retries: 10
      start_period: 30s

  redis:
    container_name: medicine-redis-dev
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_dev_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - medicine-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
      start_period: 30s

  server:
    container_name: medicine-backend-v2-dev
    build:
      context: ../..
      dockerfile: backend-v2/Dockerfile
    image: medicine-backend-v2:dev
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseContainerSupport"
      MEDICINE_DB_URL: jdbc:mysql://mysql:3306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MEDICINE_DB_USERNAME: root
      MEDICINE_DB_PASSWORD: 123456
      MEDICINE_LEGACY_DB_URL: jdbc:mysql://mysql:3306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MEDICINE_LEGACY_DB_USERNAME: root
      MEDICINE_LEGACY_DB_PASSWORD: 123456
      MEDICINE_REDIS_HOST: redis
      MEDICINE_REDIS_PORT: 6379
      MEDICINE_JWT_SECRET: local-dev-jwt-secret-change-me
      MEDICINE_STORAGE_ACCESS_KEY: local-access-key
      MEDICINE_STORAGE_SECRET_KEY: local-secret-key
    networks:
      - medicine-dev-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    security_opt:
      - seccomp:unconfined
    volumes:
      - ../logs:/app/logs
      - ../tmp:/app/tmp

  admin:
    container_name: medicine-admin-dev
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../frontend/pharmacist/dist:/usr/share/nginx/html:ro
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - medicine-dev-network
    depends_on:
      - server

networks:
  medicine-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
