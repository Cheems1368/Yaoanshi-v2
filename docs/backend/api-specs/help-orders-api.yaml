# 工单系统 API 接口规范

## 基础信息

- **API 版本**: v1
- **基础路径**: `/admin-api/help-orders`
- **认证方式**: Bearer Token
- **响应格式**: JSON

## 接口列表

### 1. 创建工单

**接口**: `POST /admin-api/help-orders/create`

**描述**: 患者创建新的工单

**请求参数**:
```json
{
  "patientId": 123,
  "title": "用药咨询",
  "description": "我想咨询一下这个药的用法",
  "intendedDrugs": ["阿司匹林", "布洛芬"],
  "attachments": ["file1.jpg", "file2.pdf"]
}
```

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "patientId": 123,
    "title": "用药咨询",
    "description": "我想咨询一下这个药的用法",
    "status": "SUBMITTED",
    "createdAt": "2024-01-01T10:00:00Z"
  },
  "msg": "success"
}
```

### 2. 工单列表

**接口**: `GET /admin-api/help-orders/page`

**描述**: 分页查询工单列表

**查询参数**:
- `pageNo`: 页码 (默认: 1)
- `pageSize`: 每页大小 (默认: 10)
- `status`: 状态过滤
- `patientId`: 患者ID过滤
- `assignedPharmacistId`: 药师ID过滤
- `assignedDoctorId`: 医生ID过滤

**响应**:
```json
{
  "code": 0,
  "data": {
    "list": [
      {
        "id": 1,
        "patientId": 123,
        "assignedPharmacistId": 456,
        "title": "用药咨询",
        "status": "PHARMACIST_REVIEW",
        "createdAt": "2024-01-01T10:00:00Z"
      }
    ],
    "total": 100
  },
  "msg": "success"
}
```

### 3. 工单详情

**接口**: `GET /admin-api/help-orders/get`

**描述**: 获取工单详细信息（包含时间线）

**路径参数**:
- `id`: 工单ID

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "patientId": 123,
    "assignedPharmacistId": 456,
    "assignedDoctorId": 789,
    "title": "用药咨询",
    "description": "我想咨询一下这个药的用法",
    "intendedDrugs": ["阿司匹林", "布洛芬"],
    "attachments": ["file1.jpg", "file2.pdf"],
    "status": "PHARMACIST_REVIEW",
    "createdAt": "2024-01-01T10:00:00Z",
    "updatedAt": "2024-01-01T11:00:00Z",
    "timeline": [
      {
        "at": "2024-01-01T10:00:00Z",
        "event": "SUBMITTED",
        "by": 123
      },
      {
        "at": "2024-01-01T10:30:00Z",
        "event": "ASSIGNED_PHARMACIST",
        "by": 456
      }
    ]
  },
  "msg": "success"
}
```

### 4. 分配药师

**接口**: `POST /admin-api/help-orders/assign`

**描述**: 将工单分配给药师

**路径参数**:
- `id`: 工单ID

**请求参数**:
```json
{
  "pharmacistId": 456
}
```

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "status": "ASSIGNED_PHARMACIST",
    "assignedPharmacistId": 456,
    "assignedAt": "2024-01-01T10:30:00Z",
    "timeline": [...]
  },
  "msg": "success"
}
```

### 5. 升级医生

**接口**: `POST /admin-api/help-orders/escalate`

**描述**: 将工单升级给医生处理

**路径参数**:
- `id`: 工单ID

**请求参数**:
```json
{
  "needDoctor": true,
  "doctorId": 789
}
```

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "status": "TO_DOCTOR",
    "assignedDoctorId": 789,
    "escalatedAt": "2024-01-01T12:00:00Z",
    "timeline": [...]
  },
  "msg": "success"
}
```

### 6. 更新工单状态

**接口**: `PUT /admin-api/help-orders/update-status`

**描述**: 更新工单状态

**路径参数**:
- `id`: 工单ID

**请求参数**:
```json
{
  "status": "DONE",
  "reason": "患者确认完成"
}
```

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "status": "DONE",
    "doneAt": "2024-01-01T15:00:00Z",
    "timeline": [...]
  },
  "msg": "success"
}
```

### 7. 驳回工单

**接口**: `POST /admin-api/help-orders/reject`

**描述**: 驳回工单

**路径参数**:
- `id`: 工单ID

**请求参数**:
```json
{
  "reason": "患者信息不完整，无法提供准确建议"
}
```

**响应**:
```json
{
  "code": 0,
  "data": {
    "id": 1,
    "status": "REJECTED",
    "rejectedAt": "2024-01-01T16:00:00Z",
    "rejectedBy": 456,
    "rejectReason": "患者信息不完整，无法提供准确建议",
    "timeline": [...]
  },
  "msg": "success"
}
```

## DTO 定义

### 创建工单请求 DTO

```java
@Data
@ApiModel("工单创建请求 DTO")
public class HelpOrderCreateReqDTO {
    
    @ApiModelProperty(value = "患者编号", required = true, example = "123")
    @NotNull(message = "患者编号不能为空")
    private Long patientId;
    
    @ApiModelProperty(value = "工单标题", required = true, example = "用药咨询")
    @NotBlank(message = "工单标题不能为空")
    @Length(max = 128, message = "工单标题长度不能超过128个字符")
    private String title;
    
    @ApiModelProperty(value = "工单描述", required = true, example = "我想咨询一下这个药的用法")
    @NotBlank(message = "工单描述不能为空")
    private String description;
    
    @ApiModelProperty(value = "意向药品", example = "[\"阿司匹林\", \"布洛芬\"]")
    private List<String> intendedDrugs;
    
    @ApiModelProperty(value = "附件列表", example = "[\"file1.jpg\", \"file2.pdf\"]")
    private List<String> attachments;
}
```

### 工单响应 DTO

```java
@Data
@ApiModel("工单响应 DTO")
public class HelpOrderRespDTO {
    
    @ApiModelProperty(value = "工单编号", example = "1")
    private Long id;
    
    @ApiModelProperty(value = "患者编号", example = "123")
    private Long patientId;
    
    @ApiModelProperty(value = "分配药师编号", example = "456")
    private Long assignedPharmacistId;
    
    @ApiModelProperty(value = "分配医生编号", example = "789")
    private Long assignedDoctorId;
    
    @ApiModelProperty(value = "工单标题", example = "用药咨询")
    private String title;
    
    @ApiModelProperty(value = "工单描述", example = "我想咨询一下这个药的用法")
    private String description;
    
    @ApiModelProperty(value = "意向药品", example = "[\"阿司匹林\", \"布洛芬\"]")
    private List<String> intendedDrugs;
    
    @ApiModelProperty(value = "附件列表", example = "[\"file1.jpg\", \"file2.pdf\"]")
    private List<String> attachments;
    
    @ApiModelProperty(value = "是否需要医生", example = "false")
    private Boolean toDoctor;
    
    @ApiModelProperty(value = "工单状态", example = "PHARMACIST_REVIEW")
    private HelpOrderStatus status;
    
    @ApiModelProperty(value = "创建时间")
    private LocalDateTime createdAt;
    
    @ApiModelProperty(value = "更新时间")
    private LocalDateTime updatedAt;
    
    @ApiModelProperty(value = "时间线")
    private List<TimelineEventDTO> timeline;
}
```

### 时间线事件 DTO

```java
@Data
@ApiModel("时间线事件 DTO")
public class TimelineEventDTO {
    
    @ApiModelProperty(value = "事件时间", example = "2024-01-01T10:00:00Z")
    private String at;
    
    @ApiModelProperty(value = "事件类型", example = "SUBMITTED")
    private String event;
    
    @ApiModelProperty(value = "操作人ID", example = "123")
    private Long by;
    
    @ApiModelProperty(value = "目标人ID", example = "456")
    private Long to;
}
```

## 权限控制

### 接口权限

| 接口 | 权限标识 | 角色要求 |
|------|----------|----------|
| 创建工单 | `help-orders:create` | 患者 |
| 工单列表 | `help-orders:query` | 药师、医生、管理员 |
| 工单详情 | `help-orders:query` | 药师、医生、管理员 |
| 分配药师 | `help-orders:assign` | 管理员 |
| 升级医生 | `help-orders:escalate` | 药师 |
| 更新状态 | `help-orders:update` | 药师、医生 |
| 驳回工单 | `help-orders:reject` | 药师、医生 |

### 数据权限

- **患者**: 只能查看自己创建的工单
- **药师**: 只能查看分配给自己的工单
- **医生**: 只能查看分配给自己的工单
- **管理员**: 可以查看所有工单

## 错误码定义

| 错误码 | 错误信息 | 说明 |
|--------|----------|------|
| 10001 | 工单不存在 | 工单ID无效 |
| 10002 | 状态转换无效 | 当前状态不允许转换到目标状态 |
| 10003 | 权限不足 | 当前用户无权限执行此操作 |
| 10004 | 参数验证失败 | 请求参数格式错误 |
| 10005 | 工单已被分配 | 工单已被其他药师/医生处理 |
