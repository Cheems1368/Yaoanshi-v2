version: "3.8"

#name: medicine-system
services:
  mysql:
    container_name: medicine-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    ports:
      - 13306:3306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medicine}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - mysql:/var/lib/mysql/
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - medicine-network

  redis:
    container_name: medicine-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - 16379:6379
    volumes:
      - redis:/data
    networks:
      - medicine-network

  server:
    container_name: medicine-server
    build:
      context: ./medicine-server/
    image: medicine-server
    restart: unless-stopped
    ports:
      - 48080:8080
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      # https://github.com/polovyivan/docker-pass-configs-to-container
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS:
        ${JAVA_OPTS:-
          -Xms512m
          -Xmx512m
          -Djava.security.egd=file:/dev/./urandom
        }
      ARGS:
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://medicine-mysql:3306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:-123456}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://medicine-mysql:3306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:-123456}
        --spring.redis.host=${REDIS_HOST:-medicine-redis}
        --medicine.captcha.enable=false
    networks:
      - medicine-network
    depends_on:
      - mysql
      - redis

  # admin:
  #   container_name: medicine-admin
  #   build:
  #     context: ../../frontend/pharmacist
  #   image: medicine-admin
  #   restart: unless-stopped
  #   ports:
  #     - 8080:80
  #   networks:
  #     - medicine-network
  #   depends_on:
  #     - server

networks:
  medicine-network:
    driver: bridge

volumes:
  mysql:
    driver: local
  redis:
    driver: local

