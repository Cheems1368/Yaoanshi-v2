# SonarQube项目配置
sonar.projectKey=medicinal-his-delivery
sonar.projectName=Medicinal HIS Delivery System
sonar.projectVersion=1.7.2-SNAPSHOT

# 源码目录
sonar.sources=medicine-module-medication/medicine-module-medication-biz/src/main/java
sonar.tests=medicine-module-medication/medicine-module-medication-biz/src/test/java

# 排除目录
sonar.exclusions=**/target/**,**/generated-sources/**,**/generated-test-sources/**
sonar.test.exclusions=**/target/**

# 代码覆盖率
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=medicine-module-medication/medicine-module-medication-biz/target/site/jacoco/jacoco.xml

# 质量门禁阈值
sonar.qualitygate.wait=true

# 编码设置
sonar.sourceEncoding=UTF-8

# Java版本
sonar.java.source=11
sonar.java.target=11
