server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend-v2
  data:
    redis:
      host: ${MEDICINE_REDIS_HOST:127.0.0.1}
      port: ${MEDICINE_REDIS_PORT:16379}
      database: ${MEDICINE_REDIS_DATABASE:0}
      password: ${MEDICINE_REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

medicine:
  auth:
    cookies:
      secure: false
      app-same-site: Lax
      admin-same-site: Lax
  datasource:
    url: ${MEDICINE_DB_URL:jdbc:mysql://127.0.0.1:13306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MEDICINE_DB_USERNAME:root}
    password: ${MEDICINE_DB_PASSWORD:}
  legacy-auth-datasource:
    url: ${MEDICINE_LEGACY_DB_URL:jdbc:mysql://127.0.0.1:13306/medicine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MEDICINE_LEGACY_DB_USERNAME:${MEDICINE_DB_USERNAME:root}}
    password: ${MEDICINE_LEGACY_DB_PASSWORD:${MEDICINE_DB_PASSWORD:}}
  ai:
    base-url: ${MEDICINE_AI_BASE_URL:https://api.siliconflow.cn/v1/chat/completions}
    api-key: ${MEDICINE_AI_API_KEY:}
    model: ${MEDICINE_AI_MODEL:zai-org/GLM-4.5-Air}
    provider-code: ${MEDICINE_AI_PROVIDER_CODE:SILICONFLOW}
    provider-display-name: ${MEDICINE_AI_PROVIDER_DISPLAY_NAME:硅基流动}
    policy-version: ${MEDICINE_AI_POLICY_VERSION:sec-005-v2}
    allowed-hosts: ${MEDICINE_AI_ALLOWED_HOSTS:api.siliconflow.cn}
    audit-retention-days: ${MEDICINE_AI_AUDIT_RETENTION_DAYS:180}
    protocol: ${MEDICINE_AI_PROTOCOL:OPENAI_CHAT}
    timeout-ms: ${MEDICINE_AI_TIMEOUT_MS:15000}
    enable-thinking: ${MEDICINE_AI_ENABLE_THINKING:false}
    max-tokens: ${MEDICINE_AI_MAX_TOKENS:2048}
    upstream-max-messages: ${MEDICINE_AI_UPSTREAM_MAX_MESSAGES:6}
  jwt:
    issuer: backend-v2
    secret: ${MEDICINE_JWT_SECRET:local-dev-jwt-secret-change-me}
    access-token-seconds: 7200
    refresh-token-seconds: 2592000
  notifications:
    websocket:
      allowed-origins: ${MEDICINE_ADMIN_WS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
      ticket-ttl-seconds: ${MEDICINE_ADMIN_WS_TICKET_TTL_SECONDS:30}
  app-notifications:
    websocket:
      allowed-origins: ${MEDICINE_APP_WS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173}
      ticket-ttl-seconds: ${MEDICINE_APP_WS_TICKET_TTL_SECONDS:30}
  storage:
    endpoint: ${MEDICINE_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${MEDICINE_STORAGE_PUBLIC_ENDPOINT:${MEDICINE_STORAGE_ENDPOINT:http://127.0.0.1:9000}}
    bucket: ${MEDICINE_STORAGE_BUCKET:yaoanshi-mvp}
    access-key: ${MEDICINE_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${MEDICINE_STORAGE_SECRET_KEY:minioadmin}
    region: ${MEDICINE_STORAGE_REGION:us-east-1}
  ocr:
    base-url: ${MEDICINE_OCR_BASE_URL:https://api.siliconflow.cn/v1/chat/completions}
    api-key: ${MEDICINE_OCR_API_KEY:}
    model: ${MEDICINE_OCR_MODEL:deepseek-ai/deepseek-vl2}
    timeout-ms: ${MEDICINE_OCR_TIMEOUT_MS:30000}
  speech:
    xfyun:
      app-id: ${MEDICINE_XFYUN_APP_ID:}
      api-key: ${MEDICINE_XFYUN_API_KEY:}
      api-secret: ${MEDICINE_XFYUN_API_SECRET:}
      base-url: ${MEDICINE_XFYUN_BASE_URL:wss://iat-api.xfyun.cn/v2/iat}
      primary-domain: ${MEDICINE_XFYUN_PRIMARY_DOMAIN:xfime-mianqie}
      fallback-domain: ${MEDICINE_XFYUN_FALLBACK_DOMAIN:iat}
      timeout-ms: ${MEDICINE_XFYUN_TIMEOUT_MS:30000}
