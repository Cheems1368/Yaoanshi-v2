server:
  port: 8080

spring:
  application:
    name: backend-v2
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

medicine:
  datasource:
    url: jdbc:mysql://localhost:3306/yaoshian_mvp
    username: replace-me
    password: replace-me
  ai:
    base-url: ${MEDICINE_AI_BASE_URL:https://api.siliconflow.cn/v1/chat/completions}
    api-key: ${MEDICINE_AI_API_KEY:}
    model: ${MEDICINE_AI_MODEL:zai-org/GLM-4.5-Air}
    protocol: ${MEDICINE_AI_PROTOCOL:OPENAI_CHAT}
    timeout-ms: ${MEDICINE_AI_TIMEOUT_MS:15000}
    enable-thinking: ${MEDICINE_AI_ENABLE_THINKING:false}
    max-tokens: ${MEDICINE_AI_MAX_TOKENS:2048}
    upstream-max-messages: ${MEDICINE_AI_UPSTREAM_MAX_MESSAGES:10}
  jwt:
    issuer: backend-v2
    secret: replace-with-secure-secret
    access-token-seconds: 7200
    refresh-token-seconds: 2592000
  notifications:
    websocket:
      allowed-origins: ${MEDICINE_ADMIN_WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
      ticket-ttl-seconds: ${MEDICINE_ADMIN_WS_TICKET_TTL_SECONDS:30}
  storage:
    endpoint: http://localhost:9000
    bucket: yaoshian-mvp
    access-key: replace-access-key
    secret-key: replace-secret-key
